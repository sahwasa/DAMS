<header class="header">
  <h1 class="main_logo">
    <a href="main.html" class="hdr-brand-title">재난 예경보 통합관리시스템</a>
  </h1>
  @@include('../inc/nav.html')
  
  <div class="hdr-util">
    <button type="button" class="hdr-user" popovertarget="p_userInfo" title="내정보" aria-label="내정보">
      <span class="hdr-user__name">홍길동 님 <small>(재난정보통신과)</small></span>
      <span class="hdr-user__ico"><i data-lucide="user-round"></i></span>
    </button>
    <ul>
      <li><button type="button" class="hdr-btn" onclick="location.href='login.html';" title="로그아웃" aria-label="로그아웃"><i data-lucide="log-out"></i></button></li>
      <li><button type="button" class="hdr-btn" title="알림" aria-label="알림"><i data-lucide="bell"></i><span class="alert_num">82</span></button></li>
      <li><button type="button" class="hdr-btn" title="전체메뉴" aria-label="전체메뉴"><i data-lucide="menu"></i></button></li>
    </ul>
  </div>
</header>
<div id="toast_alarm" class="toast-alarm">
  <div class="toast info">
    <p>신규 재난정보 승인요청이 접수되었습니다.</p>
  </div>
  <div class="toast success">
    <p>[이재민 구조] 프로세스가 완료처리 되었습니다.</p>
  </div>
  <div class="toast warning">
    <p>아직 발령하지 않은 재난정보가 있습니다.</p>
  </div>
  <div class="toast error">
    <p>메세시 전송에 실패하였습니다.</p>
  </div>
</div>

<dialog id="p_userInfo" class="modal" popover="manual" aria-labelledby="p_userInfo_title">
  <header class="modal__heading">
    <h2 id="p_userInfo_title" class="modal__title">내정보</h2>
    <button type="button" class="modal__close btn ghost icon-only" popovertarget="p_userInfo" popovertargetaction="hide"><i data-lucide="x"></i>팝업 닫기</button>
  </header>

  <section class="modal__body">
    <div class="form-grid view-mode">
      <div class="field">
        <label for="my_user_id">사용자ID</label>
        <input id="my_user_id" class="input" value="admin" readonly />
      </div>
      <div class="field">
        <label for="my_user_nm">사용자명 <span class="req">*</span></label>
        <input id="my_user_nm" class="input" value="홍길동" readonly />
      </div>
      <div class="field">
        <label for="my_blng_inst_cd">소속기관</label>
        <select id="my_blng_inst_cd" class="select">
          <option value="">소속기관</option>
        </select>
      </div>
      <div class="field">
        <label for="my_dept_cd">소속부서</label>
        <select id="my_dept_cd" class="select">
          <option value="">소속부서</option>
        </select>
      </div>
      <div class="field">
        <label for="my_pstn_nm">직급</label>
        <input id="my_pstn_nm" class="input" value="주무관" readonly />
      </div>
      <!-- <div class="field">
        <label>담당업무</label>
        <input class="input" value="재난안전" readonly />
      </div> -->
      <div class="field">
        <label for="my_mbtl_no">핸드폰</label>
        <input id="my_mbtl_no" class="input" value="010-1234-5678" readonly />
      </div>
      <div class="field">
        <label for="my_email_addr">이메일</label>
        <input id="my_email_addr" class="input" value="abcdefg@korea.go.kr" readonly />
      </div>
      <div class="field">
        <label for="my_auth_nm">권한</label>
        <input id="my_auth_nm" class="input" value="시스템운영자" readonly />
      </div>
    </div>    
  </section>
  <div class="modal__footer">
    <button type="button" class="btn primary">저장 / 수정</button>
    <button type="button" class="btn outline" popovertarget="change_password_popup">비밀번호 변경</button>
    <button type="button" class="btn neutral" popovertarget="p_userInfo" popovertargetaction="hide">닫기</button>
  </div>
</dialog>

<dialog id="change_password_popup" class="modal" popover="manual" aria-labelledby="change_password_title">
  <header class="modal__heading">
    <h2 id="change_password_title" class="modal__title">비밀번호 변경</h2>
    <button type="button" class="modal__close btn ghost icon-only" popovertargetaction="close" popovertarget="change_password_popup"><i data-lucide="x"></i>팝업 닫기</button>
  </header>

  <section class="modal__body">
    <div class="form-grid">
      <div class="field full">
        <label for="current_pswd">현재 비밀번호 <span class="req">*</span></label>
        <input class="input" type="password" id="current_pswd">
      </div>

      <div class="field full">
        <label for="new_pswd">새 비밀번호 <span class="req">*</span></label>
        <input class="input" type="password" id="new_pswd">
      </div>

      <div class="field full">
        <label for="confirm_new_pswd">새 비밀번호 확인 <span class="req">*</span></label>
        <input class="input" type="password" id="confirm_new_pswd">
        <div class="err" hidden>비밀번호가 일치하지 않습니다.</div>
      </div>
    </div>
  </section>

  <div class="modal__footer">
    <button type="button" class="btn secondary" onclick="remindMeLater()">나중에</button>
    <button type="button" class="btn primary" onclick="saveNewPassword()">저장</button>
  </div>
</dialog>
