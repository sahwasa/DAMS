<details class="symbol-legend">
  <summary class="symbol-legend__title">범례(단말기)</summary>
  <div class="symbol-legend__body">
    <ul class="symbol-legend__status">
      <li><i class="stat stat--normal" area-hidden="true"></i>성공</li>
      <li><i class="stat stat--fail" area-hidden="true"></i>실패</li>
      <li><i class="stat stat--notuse" area-hidden="true"></i>정지</li>
    </ul>
    <ul class="symbol-legend__list">
      <li><label for="BIS" class="BIS"><input type="checkbox" id="BIS" name=""> 버스정보시스템</label></li>
      <li><label for="CDB" class="CDB"><input type="checkbox" id="CDB" name=""> 재해문자전광판(행정안전부)</label></li>
      <li><label for="LDB" class="LDB"><input type="checkbox" checked id="LDB" name=""> 재해문자전광판(지자체)</label></li>
      <li><label for="TDB" class="TDB"><input type="checkbox" checked id="TDB" name=""> 교통전광판</label></li>
      <li><label for="PDB" class="PDB"><input type="checkbox" checked id="PDB" name=""> 전광판(민간)</label></li>
      <li><label for="ADD" class="ADD"><input type="checkbox" checked id="ADD" name=""> 자율주행표시장치(C-ITS)</label></li>
      <li><label for="VBS" class="VBS"><input type="checkbox" checked id="VBS" name=""> 마을방송시스템</label></li>
      <li><label for="VNS" class="VNS"><input type="checkbox" checked id="VNS" name=""> 자동음성통보시스템</label></li>
      <li><label for="VNI" class="VNI"><input type="checkbox" checked id="VNI" name=""> 자동음성통보시스템(실내)</label></li>
      <li><label for="VNO" class="VNO"><input type="checkbox" checked id="VNO" name=""> 자동음성통보시스템(실외)</label></li>
      <li><label for="RAS" class="RAS"><input type="checkbox" checked id="RAS" name=""> 자동우량경보시스템</label></li>
      <li><label for="DSB" class="DSB"><input type="checkbox" checked id="DSB" name=""> 디지털사이니지</label></li>
    </ul>       
    <ul class="symbol-legend__etc">
      <li>
        <div class="toggle">
          <input type="checkbox" id="audible-range" checked>
        </div>
        <label for="audible-range">가청범위</label>
      </li>
    </ul>    
  </div>
</details>
