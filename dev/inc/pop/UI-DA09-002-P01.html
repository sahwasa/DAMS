<!-- UI-DA09-002-P01 연계확인서 발급 승인 (팝업: openPop으로 dialog에 띄움) -->
<template id="pop-UI-DA09-002-P01" data-w="760">
<div class="pop w760" role="dialog" aria-modal="true" aria-labelledby="popTit">
  <div class="pop-head"><h2 id="popTit">연계확인서 발급 승인</h2><button type="button" class="close" title="닫기" onclick="closePop()"><i class="ri-close-line"></i></button></div>
  <div class="pop-body">
    <div class="result-box sc"><i class="ri-checkbox-circle-line"></i><div><b>총괄판정 적합 — 발급 가능</b><span>아래 내용으로 연계확인서를 발급합니다.</span></div></div>
    <table class="tbl">
      <caption class="blind">발급 승인 내용</caption>
      <colgroup><col style="width:130px"><col></colgroup>
      <tbody>
        <tr><th>지자체</th><td id="pOrg">부천시 (경기도)</td></tr>
        <tr><th>점검기간</th><td id="pPeriod">2026-10-01 ~ 2026-10-14 (14일)</td></tr>
        <tr><th>점검자</th><td id="pChecker">이점검(Admin) · 2026-10-22</td></tr>
        <tr><th>점검결과</th><td id="pResult"></td></tr>
        <tr id="sggRow" hidden><th>통합 발급<br>시군구</th><td>
          <div class="sgg-hd"><label class="chk"><input type="checkbox" id="sggAll" onchange="sggAll(this.checked)"><span>전체 선택</span></label><span class="f-msg" id="sggCnt"></span></div>
          <ul class="sgg-chk" id="sggList"></ul>
          <p class="f-msg">자체 플랫폼 없이 시도 플랫폼으로 연계하는 시군구를 선택하면 시도와 함께 연계확인서를 발급합니다. <b>자체 플랫폼이 있는 시군구</b>는 선택할 수 없으며 별도로 점검·발급을 받아야 합니다.</p>
        </td></tr>
      </tbody>
    </table>
    <div class="help-box wn mt16" style="margin-bottom:0"><i class="ri-error-warning-line"></i><span>승인 즉시 연계확인서가 발급되며 해당 기관은 <b>운영 상태로 전환</b>됩니다. 발급 이후 점검기간은 변경할 수 없습니다.</span></div>
  </div>
  <div class="pop-foot">
    <button type="button" class="btn btn-line" onclick="closePop()">취소</button>
    <button type="button" class="btn btn-crud" onclick="approve()"><i class="ri-award-line"></i>발급 승인</button>
  </div>
</div>
</template>
