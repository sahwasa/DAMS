<!-- UI-DA04-001-P01 연계기관 등록/수정 (팝업: openPop으로 dialog에 띄움) -->
<template id="pop-UI-DA04-001-P01" data-w="760">
<div class="pop w760" role="dialog" aria-modal="true" aria-labelledby="popTit">
  <div class="pop-head"><h2 id="popTit">연계기관 수정</h2><button type="button" class="close" title="닫기" onclick="closePop()"><i class="ri-close-line"></i></button></div>
  <div class="pop-body">
    <form id="destForm" onsubmit="return false">
    <table class="tbl">
      <caption class="blind">연계기관 정보</caption>
      <colgroup><col style="width:130px"><col><col style="width:130px"><col></colgroup>
      <tbody>
        <tr><th><span class="req">연계기관</span></th><td colspan="3"><div class="flex"><select class="sel" id="m_dest_sido" name="m_dest_sido" title="시도" required data-label="연계기관(시도)" style="width:200px" onchange="fillDestSigungu(this.value);setNm()"><option value="">시도 선택</option><option value="11">서울특별시</option><option value="46">전남광주통합특별시</option><option value="26">부산광역시</option><option value="27">대구광역시</option><option value="28">인천광역시</option><option value="30">대전광역시</option><option value="31">울산광역시</option><option value="36">세종특별자치시</option><option value="41">경기도</option><option value="42">강원특별자치도</option><option value="43">충청북도</option><option value="44">충청남도</option><option value="45">전북특별자치도</option><option value="47">경상북도</option><option value="48">경상남도</option><option value="50">제주특별자치도</option></select><select class="sel" id="m_dest_sgg" name="m_dest_sgg" title="시군구" onchange="setNm()" style="width:200px"><option value="">시군구 선택</option><option selected>천안시</option><option>공주시</option><option>보령시</option><option>아산시</option></select><b class="nm-v" id="m_dest_nm_v"></b></div>
          <span class="f-msg">시도만 선택하면 시도 기관(예: 충청남도), 시군구까지 선택하면 시군구 기관(예: 충청남도 천안시)으로 등록됩니다.</span><input type="hidden" id="m_dest_nm" name="m_dest_nm"></td></tr>
        <tr><th><label for="m_dest_cd" class="req">기관코드</label></th><td><input class="inp" id="m_dest_cd" name="m_dest_cd" maxlength="20" value="4492000" required data-label="기관코드"></td>
            <th>최초등록일</th><td class="ro" id="m_dest_reg">2025-02-11 10:20</td></tr>
        <!-- 연계 계정 안내(읽기 전용): 계정 등록·수정은 계정관리 화면에서 — 계정관리 [수정]으로 열면(acnt=1) 숨기고 아래 IP·ID·Password 표시 -->
        <tr id="acntInfo"><th>연계 계정</th><td colspan="3"><span class="badge" id="m_dest_acnt">미등록</span><span class="f-msg" style="display:inline;margin-left:8px">연계 계정(IP·ID·Password)은 [통합플랫폼관리 &gt; 계정관리]에서 등록·관리합니다.</span></td></tr>
        <!-- 연계 계정(IP·ID·Password): 계정관리 [수정]에서 열 때만 표시(acnt=1) -->
        <tr class="acnt-only" hidden><th><label for="m_dest_ip" class="req">IP</label></th><td colspan="3"><input class="inp" style="width:240px" id="m_dest_ip" name="m_dest_ip" maxlength="45" value="10.120.40.12" placeholder="예: 10.120.40.12" data-label="IP"></td></tr>
        <tr class="acnt-only" hidden><th><label for="m_dest_id" class="req">ID</label></th><td colspan="3"><input class="inp" style="width:240px" id="m_dest_id" name="m_dest_id" maxlength="100" value="cheonan_dams" data-label="ID"></td></tr>
        <tr class="acnt-only" hidden><th><label for="m_dest_pw" class="req">Password</label></th><td colspan="3"><div class="flex"><span class="inp-ico" style="width:240px"><input class="inp" type="password" id="m_dest_pw" name="m_dest_pw" maxlength="256" value="Dams#2026cA" autocomplete="new-password" data-label="Password"><button type="button" title="비밀번호 보기" onclick="pwEye(this)"><i class="ri-eye-line"></i></button></span><button type="button" class="btn btn-line" id="btnPwGen" onclick="genPw()"><i class="ri-magic-line"></i>자동생성</button><button type="button" class="btn btn-line" id="btnPwReset" onclick="resetPw()"><i class="ri-refresh-line"></i>비밀번호 초기화</button></div><p class="f-msg" id="pwMsg">영문 대·소문자·숫자·특수문자 포함 9자 이상</p></td></tr>
        <tr><th>연계확인서</th><td colspan="3"><div class="flex" id="m_dest_rsltdoc"><span class="badge sc">발급됨</span><span>2025-02-27</span><button type="button" class="btn s btn-line" id="btnCertView" onclick="viewCert()"><i class="ri-file-shield-2-line"></i>연계확인서 보기</button><button type="button" class="btn s btn-dg-o" id="btnCertCancel" onclick="cancelCert()"><i class="ri-close-circle-line"></i>발급 취소</button></div>
          <p class="f-msg c-pri" id="integMsg" hidden></p><span class="f-msg" id="certMsg">연계확인서 발급 승인 시 자동으로 등록됩니다(별도 업로드 없음). [발급 취소] 시 연계확인서가 무효 처리되고 발급대상기관 목록에서 다시 점검·발급해야 합니다.</span></td></tr>
        <tr><th>운영여부</th><td colspan="3"><label class="tgl"><input type="checkbox" id="m_dest_oper" name="m_dest_oper" checked onchange="operChg(this)"><span>운영</span></label></td></tr>
        <tr><th>운영시작일자</th><td class="ro" id="m_dest_opdt">2025-03-01</td><th>운영종료일자</th><td class="ro" id="m_dest_opend" title="미운영으로 전환(또는 연계확인서 발급 취소)한 날 자동 기록">-</td></tr>
        <tr><th><label for="m_pic_nm">담당자</label></th><td><input class="inp" id="m_pic_nm" name="m_pic_nm" maxlength="100" value="김민준" placeholder="담당자명"></td>
            <th><label for="m_pic_jbgd_nm">직급</label></th><td><input class="inp" id="m_pic_jbgd_nm" name="m_pic_jbgd_nm" maxlength="50" value="주무관" placeholder="예: 주무관"></td></tr>
        <tr><th><label for="m_pic_dept_nm">부서</label></th><td><input class="inp" id="m_pic_dept_nm" name="m_pic_dept_nm" maxlength="200" value="재난안전과" placeholder="소속 부서명"></td>
            <th><label for="m_pic_telno">연락처</label></th><td><input class="inp" type="tel" id="m_pic_telno" name="m_pic_telno" maxlength="20" value="041-521-2345" placeholder="예: 041-521-2345" oninput="this.value=this.value.replace(/[^0-9-]/g,'')"></td></tr>
        <tr><th><label for="m_dest_desc">비고</label></th><td colspan="3"><textarea class="txa" id="m_dest_desc" name="m_dest_desc" maxlength="4000" rows="3" style="width:100%">천안시 단말기 32개소 예경보 통합 연동</textarea></td></tr>
        <tr><th>사용여부</th><td><label class="tgl"><input type="checkbox" id="m_dest_use" name="m_dest_use" checked onchange="this.nextElementSibling.textContent=this.checked?'사용':'미사용'"><span>사용</span></label></td>
            <th>최종 수정</th><td class="ro" id="m_dest_upd">2026-09-11 12:34 (admin)</td></tr>
      </tbody>
    </table>
    </form>
  </div>
  <div class="pop-foot">
    <button type="button" class="btn btn-line" id="btnCancel" onclick="closePop()">취소</button>
    <button type="button" class="btn btn-crud" id="btnSave" onclick="saveDest()"><i class="ri-save-line"></i>저장</button>
  </div>
</div>
</template>
