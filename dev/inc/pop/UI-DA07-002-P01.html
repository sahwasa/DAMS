<!-- UI-DA07-002-P01 메뉴 등록 (팝업: openPop으로 dialog에 띄움) -->
<template id="pop-UI-DA07-002-P01" data-w="540">
<form class="pop w540" role="dialog" aria-modal="true" aria-labelledby="popTit" id="menuForm" onsubmit="return false">
  <div class="pop-head"><h2 id="popTit">메뉴 등록</h2><button type="button" class="close" title="닫기" onclick="closePop()"><i class="ri-close-line"></i></button></div>
  <div class="pop-body">
    <table class="tbl">
      <caption class="blind">메뉴 정보 입력</caption>
      <colgroup><col style="width:120px"><col></colgroup>
      <tbody>
        <tr><th><label for="m_up_menu_id" class="req">상위메뉴</label></th><td><select class="sel" id="m_up_menu_id" name="m_up_menu_id" required data-label="상위메뉴">
          <option value="-">- (1DEPTH 메뉴)</option><option value="M01">GIS상황판</option><option value="M02">재난 예경보 현황</option><option value="M03">통합플랫폼관리</option><option value="M04">통계</option><option value="M05">이용안내</option><option value="M06">시스템관리</option><option value="M07">시스템 이력</option></select>
          <span class="f-msg">‘-’ 선택 시 1DEPTH 메뉴로 등록됩니다.</span></td></tr>
        <tr><th><label for="m_menu_id" class="req">메뉴ID</label></th><td><input class="inp" id="m_menu_id" name="m_menu_id" maxlength="20" placeholder="예: M0208" required data-label="메뉴ID"><span class="f-msg" id="idMsg">영문·숫자 20자 이내, 중복 불가</span></td></tr>
        <tr><th><label for="m_menu_nm" class="req">메뉴명</label></th><td><input class="inp" id="m_menu_nm" name="m_menu_nm" maxlength="100" required data-label="메뉴명"></td></tr>
        <tr><th><label for="m_menu_path" class="req">URL경로</label></th><td><input class="inp" id="m_menu_path" name="m_menu_path" maxlength="300" placeholder="예: /sys/menu.do" required data-label="URL경로"></td></tr>
        <tr><th>기능</th><td><label class="chk"><input type="checkbox" name="m_menu_fn" value="EDT"><span>편집</span></label><label class="chk"><input type="checkbox" name="m_menu_fn" value="DWN"><span>다운</span></label>
          <span class="f-msg">편집=등록·수정·삭제, 다운=엑셀·PDF·CAP 파일 다운로드. 선택한 기능은 사용자 권한관리에서 권한 그룹별로 부여합니다.</span></td></tr>
        <tr><th><label for="m_menu_seq" class="req">순서</label></th><td><input class="inp auto" type="number" min="1" max="99" style="width:100px" id="m_menu_seq" name="m_menu_seq" value="1" required data-label="순서"></td></tr>
        <tr><th>사용여부</th><td><label class="tgl"><input type="checkbox" id="m_use_yn" name="m_use_yn" checked onchange="this.nextElementSibling.textContent=this.checked?'사용':'미사용'"><span>사용</span></label></td></tr>
        <tr><th><label for="m_menu_rmk">비고</label></th><td><textarea class="txa" id="m_menu_rmk" name="m_menu_rmk" rows="3" maxlength="500" style="width:100%"></textarea></td></tr>
      </tbody>
    </table>
  </div>
  <div class="pop-foot">
    <button type="button" class="btn btn-line" id="btnDel" hidden onclick="removeMenu()">삭제</button>
    <button type="button" class="btn btn-line" onclick="closePop()">닫기</button>
    <button type="button" class="btn btn-crud" id="btnSave" onclick="save()">저장</button>
  </div>
</form>
</template>
