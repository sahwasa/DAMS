<!-- UI-DA04-002-P01 통합플랫폼 계정 등록 (팝업: openPop으로 dialog에 띄움) -->
<template id="pop-UI-DA04-002-P01" data-w="540">
<div class="pop w540" role="dialog" aria-modal="true" aria-labelledby="popTit">
  <div class="pop-head"><h2 id="popTit">통합플랫폼 계정 등록</h2><button type="button" class="close" title="닫기" onclick="closePop()"><i class="ri-close-line"></i></button></div>
  <div class="pop-body">
    <div class="help-box"><i class="ri-information-line"></i><span>법정동을 선택해 검색하면 연계기관현황에 등록된 기관 중 <b>운영 중</b>이고 계정이 등록되지 않은 기관만 표시됩니다.</span></div>
    <form id="acntForm" onsubmit="searchOperInst();return false">
    <table class="tbl">
      <caption class="blind">계정 등록</caption>
      <colgroup><col style="width:120px"><col></colgroup>
      <tbody>
        <tr><th><span class="req">법정동</span></th><td><div class="flex"><select class="sel" id="reg_sido" name="reg_sido" title="시도" required data-label="법정동(시도)" onchange="fillSgg(this.value)"><option value="">시도 선택</option><option value="31">울산광역시</option><option value="41">경기도</option><option value="43">충청북도</option><option value="44">충청남도</option></select><select class="sel" id="reg_sgg" name="reg_sgg" title="시군구"><option value="">시군구 전체</option></select><button type="submit" class="btn btn-sch" id="btnRegSearch"><i class="ri-search-line"></i>검색</button></div></td></tr>
        <tr><th><label for="reg_inst" class="req">연계기관</label></th><td><select class="sel" id="reg_inst" name="reg_inst" required data-label="연계기관" disabled onchange="pickInst(this)"><option value="">법정동 검색 후 선택</option></select><span class="f-msg" id="instMsg">검색된 기관이 없습니다.</span></td></tr>
        <tr><th>기관코드</th><td class="ro" id="regCd">-</td></tr>
        <tr><th><label for="reg_ip" class="req">IP</label></th><td><input class="inp" id="reg_ip" name="reg_ip" maxlength="45" placeholder="예: 10.120.40.12" required data-label="IP"></td></tr>
        <tr><th><label for="reg_id" class="req">ID</label></th><td><div class="flex"><input class="inp" style="flex:1;min-width:0" id="reg_id" name="reg_id" maxlength="100" placeholder="영문·숫자 4~20자" required data-label="ID" oninput="idOk=false"><button type="button" class="btn btn-line" id="btnChkId" onclick="checkId()">중복확인</button></div></td></tr>
        <tr><th><label for="reg_pw" class="req">Password</label></th><td><div class="flex"><span class="inp-ico" style="flex:1;min-width:0"><input class="inp" type="password" id="reg_pw" name="reg_pw" maxlength="256" autocomplete="new-password" placeholder="영문·숫자·특수문자 9자 이상" required data-label="Password"><button type="button" title="비밀번호 보기" onclick="pwEye(this)"><i class="ri-eye-line"></i></button></span><button type="button" class="btn btn-line" id="btnPwGen" onclick="var p=$('reg_pw');p.value=pwGen(12);pwEye(p.nextElementSibling,true);msg('비밀번호가 자동생성되었습니다.')"><i class="ri-magic-line"></i>자동생성</button></div></td></tr>
      </tbody>
    </table>
    </form>
  </div>
  <div class="pop-foot">
    <button type="button" class="btn btn-line" onclick="closePop()">취소</button>
    <button type="button" class="btn btn-crud" onclick="saveAccount()"><i class="ri-add-line"></i>등록</button>
  </div>
</div>
</template>
