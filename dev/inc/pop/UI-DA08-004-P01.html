        <tr><th><label for="m_srvr_cd"><span class="req">대상서버</span></label></th><td><select class="sel" id="m_srvr_cd" name="m_srvr_cd" required data-label="대상서버"><option value="">선택</option><option>연계서버 1호</option><option>연계서버 2호</option><option>WEB서버</option><option>WAS서버 1호</option><option>WAS서버 2호</option><option>DB서버</option><option>통합플랫폼 GW</option><option>충남 아산시 연계서버</option><option>울산 남구 예경보서버</option><option>강원 철원군 연계서버</option></select></td>

</div>
</template>
