        <tr><th>수신자</th><td id="d_rcvr_nm">김*리</td></tr>
        <tr><th>수신번호</th><td id="d_rcvr">010-****-5678</td></tr>

  </div>
  <div class="pop-foot">
    <button type="button" class="btn btn-line" id="btnClose" onclick="closePop()">닫기</button>
    <button type="button" class="btn btn-crud" id="btnResend" onclick="resend()"><i class="ri-send-plane-line"></i>재발송</button>
  </div>
</div>
</template>
