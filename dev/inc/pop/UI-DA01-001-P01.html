<!-- UI-DA01-001-P01 NDMS 권한신청 안내 (팝업: openPop으로 dialog에 띄움) -->
<template id="pop-UI-DA01-001-P01" data-w="540">
<div class="pop w540" role="dialog" aria-modal="true" aria-labelledby="popTit">
  <div class="pop-head"><h2 id="popTit">NDMS 권한신청 안내</h2><button type="button" class="close" title="닫기" onclick="closePop()"><i class="ri-close-line"></i></button></div>
  <div class="pop-body">
    <div class="help-box"><i class="ri-information-line"></i><span>DAMS는 <b>NDMS에 등록한 GPKI 인증서</b>로 로그인합니다. 계정이 없거나 DAMS 업무권한이 없으면 아래 절차로 권한을 신청하세요.</span></div>
    <div class="sub-head mt0"><h3 class="h4">NDMS 권한신청 절차</h3></div>
    <ol class="step-list">
      <li>행정안전부 국가재난관리정보시스템(NDMS) 포털에 접속합니다.</li>
      <li>[사용자 지원] &gt; [업무권한 신청] 메뉴로 이동합니다.</li>
      <li>업무분야에서 <b>재난예경보 통합관리시스템(DAMS)</b>을 선택합니다.</li>
      <li>신청 권한(사용자 / 운영자 / 관리자)을 선택하고 결재선을 지정하여 상신합니다.</li>
      <li>행정안전부 관리자 승인 후 인증서 로그인이 가능합니다.</li>
    </ol>
    <table class="tbl mt16">
      <caption class="blind">권한신청 문의처</caption>
      <colgroup><col style="width:120px"><col></colgroup>
      <tbody>
        <tr><th>문의 부서</th><td>행정안전부 재난정보통신과</td></tr>
        <tr><th>운영 지원</th><td>DAMS 운영지원센터 044-205-0000 (평일 09:00~18:00)</td></tr>
      </tbody>
    </table>
  </div>
  <div class="pop-foot">
    <button type="button" class="btn btn-line" onclick="goNdms()"><i class="ri-external-link-line"></i>NDMS 포털 바로가기</button>
    <button type="button" class="btn btn-crud" onclick="closePop()">확인</button>
  </div>
</div>
</template>
