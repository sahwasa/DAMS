<!-- UI-DA07-001-P01 사용자 상세정보 (팝업: openPop으로 dialog에 띄움) -->
<template id="pop-UI-DA07-001-P01" data-w="760">
<div class="pop w760" role="dialog" aria-modal="true" aria-labelledby="popTit">
  <div class="pop-head"><h2 id="popTit">사용자 상세정보</h2><button type="button" class="close" title="닫기" onclick="closeDetail()"><i class="ri-close-line"></i></button></div>
  <div class="pop-body">
    <table class="tbl">
      <caption class="blind">사용자 상세정보</caption>
      <colgroup><col style="width:120px"><col><col style="width:120px"><col></colgroup>
      <tbody>
        <tr><th>사용자 ID</th><td id="d_user_id">admin</td><th>사용자명</th><td id="d_user_nm">김*리</td></tr>
        <tr><th>기관명</th><td id="d_inst_nm">행정안전부</td><th>부서</th><td id="d_dept_nm">재난정보통신과</td></tr>
        <tr><th>직급</th><td id="d_jbps_nm">주무관</td><th>사용여부</th><td><label class="tgl"><input type="checkbox" id="d_use_yn" name="d_use_yn" checked onchange="updateUseYn(this)"><span id="d_use_txt">사용</span></label></td></tr>
        <tr><th>문자수신</th><td colspan="3"><label class="tgl"><input type="checkbox" id="d_sms_rcptn_yn" name="d_sms_rcptn_yn" onchange="smsChg(this)"><span id="d_sms_txt">미수신</span></label><span class="f-msg">수신으로 두면 장애·긴급 알림 문자를 NDMS 계정에 등록된 휴대전화번호로 받습니다.</span></td></tr>
        <tr><th>계정잠금</th><td colspan="3"><span class="badge" id="d_acnt_lck_yn">정상</span><span class="f-msg" id="d_lck_info" style="display:inline;margin:0 8px">비밀번호 오류 0회</span><button type="button" class="btn s btn-line" id="btnUnlock" onclick="unlockAcnt()" hidden><i class="ri-lock-unlock-line"></i>잠금 해제</button></td></tr>
        <tr><th><label for="d_auth_cd">권한</label></th><td colspan="3"><select class="sel" id="d_auth_cd" name="d_auth_cd" style="width:320px" onchange="authChg()">
          <option value="DAMS_ADM" data-g="관리자">관리자 · DAMS_ADM</option><option value="DAMS_OPR01" data-g="운영자">운영자 · DAMS_OPR01</option>
          <option value="DAMS_USR01" data-g="사용자">사용자 · DAMS_USR01 (중앙재난안전상황실)</option><option value="DAMS_USR02" data-g="사용자">사용자 · DAMS_USR02 (재난대응정책과)</option>
          <option value="DAMS_USR03" data-g="사용자">사용자 · DAMS_USR03 (자연·사회재난대응 부서)</option><option value="DAMS_USR04" data-g="사용자">사용자 · DAMS_USR04 (기타 부서 조회)</option></select>
          <span class="f-msg" id="authMsg">권한을 바꾸면 사용자 권한관리에 설정된 그 권한 그룹의 메뉴접근·기능 권한이 적용됩니다.</span></td></tr>
      </tbody>
    </table>
    <div class="help-box mt16" style="margin-bottom:0"><i class="ri-information-line"></i><span>사용자 정보는 NDMS 계정 정보와 연동되어 조회만 가능하며, 권한·사용여부·문자수신만 변경할 수 있습니다. 아이디 로그인에서 비밀번호를 5회 연속 틀려 잠긴 계정은 [잠금 해제]로 풀 수 있습니다.</span></div>
  </div>
  <div class="pop-foot">
    <button type="button" class="btn btn-line" onclick="closeDetail()">닫기</button>
    <button type="button" class="btn btn-crud" id="btnAuthSave" onclick="saveAuth()"><i class="ri-save-line"></i>권한 저장</button>
  </div>
</div>
</template>
