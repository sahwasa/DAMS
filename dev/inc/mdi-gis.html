<!-- MDI 탭(GIS상황판: 탭 1개) -->
      <div class="mdi" role="navigation" aria-label="열린 화면 탭">
        <ul class="mdi-tabs">
          <li class="on"><a href="@@file">@@name</a><button type="button" title="닫기" data-mdi="close"><i class="ri-close-line"></i></button></li>
        </ul>
        <div class="mdi-ctrl">
          <button type="button" title="이전" data-mdi="prev"><i class="ri-arrow-left-s-line"></i></button>
          <button type="button" title="다음" data-mdi="next"><i class="ri-arrow-right-s-line"></i></button>
          <button type="button" title="전체닫기" data-mdi="all"><i class="ri-close-line"></i></button>
        </div>
      </div>
