<div class="symbol symbol--device" style="--left:700px;--top:500px">
  <button type="button" class="BIS selected">사간 (안성-V198)</button>
  <div class="layer" style="display: block;">
    <header class="layer__heading">
      <strong class="layer__title">사간 (안성-V198)</strong>
      <button type="button" class="layer__close" area-label="닫기" onclick="document.activeElement.blur();"><i data-lucide="x">닫기</i></button>
    </header>
    <div class="layer__body">
      <ul class="grid-list">
        <dt>유형</dt><dd>버스정보시스템</dd>
        <dt>예경보 서버</dt><dd>안성 버스정보시스템</dd>
        <dt>상태</dt>
        <dd>
          <span class="stat-text stat-text--ok">성공</span>
          <!-- <span class="stat-text stat-text--ng">실패</span>      -->
        </dd>
        <dt>메모</dt>
        <dd>비정상 사유</dd>
        <dt>가청범위</dt>
        <dd>300m ~ 500m</dd>
      </ul>
    </div>
  </div>
</div>
